[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"
[project]
name = "iam-sra-demo"
version = "0.1.0"
description = "Experimental IAM scenario self-assessment"
requires-python = ">=3.10,<3.13"
dependencies = ["streamlit==1.45.1", "pydantic==2.11.4", "httpx==0.28.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
